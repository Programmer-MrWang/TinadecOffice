<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TinadecOffice · 命令面板交互草图</title>
<style>
/* Standalone discussion artifact. Palette values mirror desktop/styles.css;
   this file does not import application code, fetch data, or persist settings. */
:root{color-scheme:light;--text-primary:#1f2328;--text-secondary:#656d76;--text-muted:#7a8390;--border-muted:#e8ecf0;--surface-section:rgba(255,255,255,.94);--surface-input:#fff;--surface-hover:#f1f5f3;--accent-primary:#1f8f80;--accent-soft:rgba(31,143,128,.1);--shadow-panel:0 4px 16px rgba(26,37,38,.07);--shadow-elevated:0 8px 28px rgba(26,37,38,.12)}
*{box-sizing:border-box}body{margin:0;background:#f5f7f6;color:var(--text-primary);font:14px/1.5 "Segoe UI","Microsoft YaHei",sans-serif}button,input,textarea{font:inherit;color:inherit}button{cursor:pointer;border:0;background:none}button:disabled{cursor:default}button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--accent-primary);outline-offset:2px}[hidden]{display:none!important}
.page{max-width:1100px;margin:32px auto;padding:0 28px}.heading{display:flex;align-items:center;gap:16px;justify-content:space-between;margin-bottom:18px}h1{font-size:18px;font-weight:600;margin:0}.badge{font-size:12px;color:var(--accent-primary);background:var(--accent-soft);padding:5px 10px;border-radius:20px}.intro{color:var(--text-secondary);margin:5px 0 20px;font-size:13px}.window{height:740px;min-height:650px;border:1px solid var(--border-muted);border-radius:16px;background:#fafcfb;overflow:hidden;box-shadow:var(--shadow-panel);position:relative}.bar{height:58px;padding:0 22px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border-muted);background:var(--surface-section)}.brand{font-weight:600;letter-spacing:.2px}.tabs{display:flex;gap:3px;background:var(--surface-hover);padding:3px;border-radius:8px}.tabs button{padding:5px 13px;border-radius:6px;font-size:12px;color:var(--text-secondary)}.tabs button[aria-pressed=true]{background:var(--surface-input);color:var(--text-primary);box-shadow:var(--shadow-panel)}.workspace{position:absolute;inset:58px 0 0}.workspace.space{background-image:radial-gradient(#dce4df .7px,transparent .7px);background-size:20px 20px}.context{padding:32px 32px;color:var(--text-secondary);font-size:13px}.context strong{display:block;color:var(--text-primary);font-size:17px;font-weight:500;margin-bottom:5px}.context p{max-width:440px;margin:0}.dock{position:absolute;bottom:26px;width:min(620px,calc(100% - 48px));left:50%;transform:translateX(-50%)}.panel{position:absolute;bottom:calc(100% + 10px);width:100%;border:1px solid var(--border-muted);border-radius:12px;background:var(--surface-section);box-shadow:var(--shadow-elevated);backdrop-filter:blur(14px);overflow:hidden}.panel-head{padding:12px 14px 8px;display:flex;align-items:center;gap:8px}.panel-head strong{font-size:13px;font-weight:600;flex:1}.muted{font-size:11px;color:var(--text-muted)}.icon-button{display:grid;place-items:center;width:27px;height:27px;border-radius:6px;font-size:18px}.icon-button:hover{background:var(--surface-hover)}.search-wrap{display:flex;align-items:center;gap:8px;margin:0 12px 8px;padding:7px 10px;border-radius:7px;background:var(--surface-hover);color:var(--text-secondary)}.search-wrap input{width:100%;border:0;background:none;outline:none;font-size:13px}.list{max-height:370px;overflow:auto;padding:0 6px 8px;overscroll-behavior:contain;scrollbar-width:thin}.group{padding:11px 9px 4px;font-size:11px;color:var(--text-muted)}.row{display:flex;width:100%;align-items:center;gap:10px;border-radius:7px;text-align:left;padding:8px 10px;min-height:40px}.row:hover:not(:disabled),.row.active{background:var(--surface-hover)}.row:disabled{opacity:.58}.glyph{width:21px;text-align:center;color:var(--text-secondary);font-size:16px}.copy{flex:1;min-width:0}.label{display:block;font-size:13px}.detail{display:block;color:var(--text-secondary);font-size:11px;margin-top:1px}.value{font-size:12px;color:var(--text-secondary)}.arrow{color:var(--text-muted)}.switch{display:inline-flex;align-items:center;width:28px;height:16px;border-radius:10px;background:#c7ceca;padding:2px;flex-shrink:0}.switch:after{content:"";height:12px;width:12px;border-radius:50%;background:#fff}.row[aria-checked=true] .switch{background:var(--accent-primary);justify-content:flex-end}.panel-foot{border-top:1px solid var(--border-muted);padding:8px 15px;font-size:11px;color:var(--text-muted);display:flex;justify-content:space-between;gap:12px}.composer{background:var(--surface-input);border-radius:12px;box-shadow:var(--shadow-panel);border:1px solid var(--border-muted);padding:10px 12px}.input-line{display:flex;align-items:flex-end;gap:9px}.plus{font-size:23px;font-weight:300;width:28px;height:30px;border-radius:6px;flex-shrink:0}.plus:hover,.plus[aria-expanded=true]{background:var(--surface-hover)}textarea{width:100%;resize:none;border:0;background:none;outline:none;min-height:31px;max-height:100px;padding:4px 0;line-height:23px;font-size:13px}.send{background:var(--accent-primary);color:white;border-radius:8px;width:29px;height:29px;font-size:18px;flex-shrink:0}.chips{display:flex;flex-wrap:wrap;gap:5px;padding:8px 0 1px 36px}.chip{font-size:11px;border-radius:5px;background:var(--surface-hover);padding:3px 7px;color:var(--text-secondary)}.chip.enabled{color:var(--accent-primary);background:var(--accent-soft)}.hint{text-align:center;color:var(--text-muted);font-size:11px;margin-top:9px}.status{position:absolute;bottom:0;left:0;right:0;min-height:20px;text-align:center;font-size:11px;color:var(--text-secondary)}.notes{font-size:12px;color:var(--text-secondary);margin-top:16px}.notes a{color:var(--accent-primary)}.empty{padding:25px 12px;color:var(--text-secondary);font-size:13px}.mobile-note{display:none}
@media(max-width:600px){.page{margin:18px auto;padding:0 12px}.heading{align-items:flex-start;gap:8px}.badge{max-width:140px;white-space:normal}h1{font-size:16px}.window{height:740px}.context{padding:22px}.dock{width:calc(100% - 24px);bottom:26px}.list{max-height:355px}.panel-foot{font-size:10px}.muted{font-size:10px}.value{max-width:120px;text-align:right}.bar{padding:0 14px}.chips{padding-left:0}}
</style>
<main class="page">
 <div class="heading"><h1>TinadecOffice · 会话命令面板</h1><span class="badge">交互草图 · 未连接运行时</span></div>
 <p class="intro">讨论入口、布局和设置反馈。所有选择仅在此页内演示，候选功能不代表产品已实现。</p>
 <section class="window" aria-label="命令面板交互预览">
  <header class="bar"><span class="brand">TinadecOffice</span><div class="tabs" aria-label="预览视图"><button id="flat" aria-pressed="false">平面</button><button id="space" aria-pressed="true">空间</button></div></header>
  <div class="workspace space" id="workspace"><div class="context"><strong id="context-title">空间会话</strong><p id="context-copy">通过功能选项自定义编排。开启哪些功能，由你决定。</p></div>
   <div class="dock">
    <section class="panel" id="panel" role="dialog" aria-modal="false" aria-labelledby="panel-title">
     <div class="panel-head"><button class="icon-button" id="back" aria-label="返回主面板" hidden>‹</button><strong id="panel-title">会话命令</strong><span class="muted">本会话 · 示例</span><button class="icon-button" id="close" aria-label="关闭命令面板">×</button></div>
     <label class="search-wrap"><span aria-hidden="true">⌕</span><input id="search" type="search" placeholder="搜索设置或命令…" aria-label="搜索设置或命令" aria-controls="list" autocomplete="off"></label>
     <div class="list" id="list"></div>
     <div class="panel-foot"><span>候选设置 · 拟从下一轮生效</span><span>↑↓ 选择　Enter 确认　Esc 返回</span></div>
    </section>
    <div class="composer"><div class="input-line"><button class="plus" id="plus" aria-label="打开会话命令面板" aria-haspopup="dialog" aria-expanded="true" aria-controls="panel">+</button><textarea id="draft" rows="1" placeholder="输入消息，或 / 搜索命令" aria-label="消息草稿"></textarea><button class="send" id="send" aria-label="模拟发送">↑</button></div><div id="chips" class="chips" aria-label="当前演示设置"></div></div>
    <div class="hint">+ 与 / 打开同一面板；已有消息草稿会保留。</div>
   </div><div id="status" class="status" role="status" aria-live="polite"></div>
  </div>
 </section>
 <p class="notes">平面选择预设智能体模式；空间通过功能选项自定义编排。模型仅展示占位值，空间开关仍为设计候选。<br>关联范围：APP-RENDERER-104；此草图不改动产品页面、真实设置、会话或运行任务。</p>
</main>
<script>
'use strict';
const $=id=>document.getElementById(id);
const state={view:'space',page:'root',open:true,query:'',selected:0,workMode:'Team',source:'button',slashBase:'',toggles:{plan:false,spec:false,agents:false,workflow:false,board:false,worktree:false}};
const features=[['plan','计划优先','plan planning','复杂任务先形成计划，再继续执行'],['spec','规范驱动','spec specification','先明确目标、约束和验收标准'],['agents','多智能体协作','agents team parallel','允许按任务需要组织协作'],['workflow','工作流','workflow','按明确的流程推进任务'],['board','公告板','board','共享任务进展和协作信息'],['worktree','Worktree 隔离','worktree git','为执行工作使用独立工作树']];
const modes=['Team','Graph','Workflow','Solo','Plan','Review','Spec'];
const descriptions={Team:'团队协作',Graph:'图式协作',Workflow:'流程编排',Solo:'单智能体',Plan:'调研并制定方案，等待你决定执行',Review:'审查工作模式',Spec:'规范工作模式'};
let visible=[];
function rootRows(){return [
 {id:'image',group:'添加内容',label:'图片',icon:'▧',keywords:'image photo',detail:'添加到当前消息（示意）'},
 {id:'file',group:'添加内容',label:'文件',icon:'▤',keywords:'file attachment',detail:'添加到当前消息（示意）'},
 {id:'model',group:'会话设置',label:'对话模型',icon:'◇',value:'跟随默认 · 占位',page:'model',keywords:'model'},
 ...(state.view==='flat'?[{id:'mode',group:'会话设置',label:'预设模式',icon:'◫',value:state.workMode,page:'mode',keywords:'mode team graph workflow solo plan review spec'}]:[]),
 ...(state.view==='space'?features.map(([id,label,keywords,detail])=>({id,group:'空间功能 · 候选开关',label,keywords,detail,toggle:true,icon:'·'})):[]),
 {id:'new',group:'会话操作',label:'新建会话',icon:'＋',value:'/new',keywords:'new',detail:'草图仅演示反馈，不创建会话'}
];}
function rows(){if(state.page==='mode')return modes.map(mode=>({id:'mode:'+mode,label:mode,detail:descriptions[mode],value:mode===state.workMode?'✓':'',keywords:mode,group:'预设模式 · 示意目录'}));if(state.page==='model')return [{id:'model:default',label:'跟随会话默认',detail:'实际实现将读取 Core 模型目录及可用状态',value:'✓',group:'模型占位'}, {id:'model:placeholder',label:'具体提供商与模型',detail:'尚未连接运行时，不伪造可用模型',disabled:true}];return rootRows();}
function text(parent,tag,value,cls){const el=document.createElement(tag);if(cls)el.className=cls;el.textContent=value;parent.append(el);return el;}
function consumeSlash(){if(state.source==='slash'){$('draft').value=state.slashBase;state.source='button';}}
function announce(message){$('status').textContent=message;}
function render(){
 $('panel').hidden=!state.open;$('plus').setAttribute('aria-expanded',String(state.open));$('back').hidden=state.page==='root';$('panel-title').textContent=state.page==='mode'?'预设模式':state.page==='model'?'对话模型':'会话命令';
 const query=state.query.toLowerCase().trim();visible=rows().filter(row=>[row.label,row.keywords,row.detail,row.value].join(' ').toLowerCase().includes(query));state.selected=Math.min(state.selected,Math.max(0,visible.filter(r=>!r.disabled).length-1));
 const list=$('list');list.replaceChildren();let group='',index=0;
 for(const row of visible){if(row.group&&row.group!==group){group=row.group;text(list,'div',group,'group');}const button=document.createElement('button');button.type='button';button.className='row';button.dataset.id=row.id;button.disabled=!!row.disabled;if(!row.disabled){button.dataset.index=String(index);button.classList.toggle('active',index===state.selected);index++;}if(row.toggle){button.setAttribute('role','switch');button.setAttribute('aria-checked',String(state.toggles[row.id]));}if(row.icon)text(button,'span',row.icon,'glyph').setAttribute('aria-hidden','true');const copy=text(button,'span','','copy');text(copy,'span',row.label,'label');if(row.detail)text(copy,'span',row.detail,'detail');if(row.value)text(button,'span',row.value,'value');if(row.page)text(button,'span','›','arrow');if(row.toggle)text(button,'span','','switch').setAttribute('aria-hidden','true');button.addEventListener('click',()=>activate(row));button.addEventListener('mouseenter',()=>{if(button.disabled)return;state.selected=Number(button.dataset.index);highlight();});list.append(button);}
 if(!visible.length)text(list,'div','没有匹配项，试试「模型」或「计划」。','empty');renderChips();
}
function highlight(){document.querySelectorAll('.row[data-index]').forEach(el=>el.classList.toggle('active',Number(el.dataset.index)===state.selected));}
function renderChips(){const chips=$('chips');chips.replaceChildren();text(chips,'span','模型：跟随默认（示例）','chip');if(state.view==='flat')text(chips,'span',state.workMode+'（示例）','chip');else{const enabled=features.filter(([id])=>state.toggles[id]);if(!enabled.length)text(chips,'span','尚未开启候选功能','chip');enabled.forEach(([,label])=>text(chips,'span',label+' · 示例','chip enabled'));}}
function openPanel(source='button'){state.open=true;state.page='root';state.query='';state.selected=0;state.source=source;$('search').value='';render();if(source==='button')$('search').focus();}
function closePanel(){consumeSlash();state.open=false;render();$('draft').focus();}
function resetPage(page){consumeSlash();state.page=page;state.query='';state.selected=0;$('search').value='';render();$('search').focus();}
function activate(row){if(row.disabled)return;if(row.page){resetPage(row.page);return;}consumeSlash();if(row.toggle){state.toggles[row.id]=!state.toggles[row.id];announce('示例：'+row.label+(state.toggles[row.id]?'已开启':'已关闭')+'；真实运行行为待实现。');state.query='';$('search').value='';render();$('search').focus();return;}if(row.id.startsWith('mode:')){state.workMode=row.id.slice(5);announce('示例预设模式已选为 '+state.workMode+'，未修改真实会话。');resetPage('root');return;}if(row.id==='model:default'){resetPage('root');return;}if(row.id==='image'||row.id==='file'){announce('示例：此处将打开'+(row.id==='image'?'图片':'文件')+'选择器，当前草稿保持不变。');closePanel();return;}announce('示例：已选择新建会话。本页不创建会话，保留草稿。');closePanel();}
function keyboard(event){if(event.isComposing)return;if(!state.open)return;if(event.key==='Escape'){event.preventDefault();event.stopPropagation();state.page==='root'?closePanel():resetPage('root');return;}if(event.key==='ArrowDown'||event.key==='ArrowUp'){event.preventDefault();const count=visible.filter(row=>!row.disabled).length;if(!count)return;state.selected=(state.selected+(event.key==='ArrowDown'?1:-1)+count)%count;highlight();document.querySelector('.row.active')?.scrollIntoView({block:'nearest'});return;}if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();const row=visible.filter(row=>!row.disabled)[state.selected];if(row)activate(row);}}
function setView(view){consumeSlash();state.view=view;state.page='root';state.query='';state.selected=0;$('search').value='';$('workspace').classList.toggle('space',view==='space');$('flat').setAttribute('aria-pressed',String(view==='flat'));$('space').setAttribute('aria-pressed',String(view==='space'));$('context-title').textContent=view==='space'?'空间会话':'平面对话';$('context-copy').textContent=view==='space'?'通过功能选项自定义编排。开启哪些功能，由你决定。':'选择预设智能体模式，调整这段对话的工作方式。';render();}
$('flat').onclick=()=>setView('flat');$('space').onclick=()=>setView('space');$('plus').onclick=()=>state.open?closePanel():openPanel();$('close').onclick=closePanel;$('back').onclick=()=>resetPage('root');
$('search').oninput=()=>{state.query=$('search').value;state.selected=0;render();};$('search').addEventListener('keydown',keyboard);$('list').addEventListener('keydown',keyboard);
$('draft').addEventListener('input',()=>{const value=$('draft').value;const match=/(^|\s)\/([^\n]*)$/.exec(value);if(match){state.slashBase=value.slice(0,match.index+match[1].length);state.source='slash';state.open=true;state.page='root';state.query=match[2];state.selected=0;$('search').value=match[2];render();}else if(state.source==='slash'){state.source='button';state.open=false;render();}});
$('draft').addEventListener('keydown',event=>{if(event.isComposing)return;if(state.open){keyboard(event);return;}if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();$('send').click();}});
$('send').onclick=()=>{if(state.open&&state.source==='slash'){const row=visible.filter(r=>!r.disabled)[state.selected];if(row)activate(row);return;}announce('仅为交互草图，消息没有发送，草稿已保留。');};
document.addEventListener('pointerdown',event=>{if(state.open&&!$('panel').contains(event.target)&&!$('plus').contains(event.target)&&!$('draft').contains(event.target)&&!event.target.closest('.tabs')){consumeSlash();state.open=false;render();}});
document.addEventListener('keydown',event=>{if(event.key==='Escape'&&!event.defaultPrevented)keyboard(event);});
render();
</script>
</html>
